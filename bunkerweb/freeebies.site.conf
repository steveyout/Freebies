# BunkerWeb Reverse Proxy Configuration for freeebies.site
# Place this file in /etc/bunkerweb/configs/freeebies.site.conf or include in BunkerWeb reverse proxy settings

# If using BunkerWeb Multisite Environment variables:
# SERVER_NAME=freeebies.site www.freeebies.site
# USE_REVERSE_PROXY=yes
# REVERSE_PROXY_URL=http://127.0.0.1:3050
# REVERSE_PROXY_WS=yes
# AUTO_LETS_ENCRYPT=yes

# Custom Nginx proxy block for WebSocket + Socket.IO and Next.js caching:
location /api/socketio/ {
    proxy_pass http://127.0.0.1:3050/api/socketio/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location /_next/static/ {
    proxy_pass http://127.0.0.1:3050/_next/static/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 365d;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3050;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
