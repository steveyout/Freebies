name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'production-deployment'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deployment Dependencies
        run: pip install paramiko

      - name: Execute Deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          python deploy/deploy.py 2>&1 | tee deploy_execution.log
          EXIT_STATUS=${PIPESTATUS[0]}
          echo "### 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy_execution.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_STATUS
