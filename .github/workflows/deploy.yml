name: Build, Test & Deploy to VPS (BunkerWeb + Next.js)

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'production-deployment'
  cancel-in-progress: false

jobs:
  # 1. CI Validation: Compile and build on GitHub runner first to protect the VPS from broken code
  build-and-verify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Next.js Build
        run: pnpm run build

  # 2. CD Deployment: Deploy to VPS securely using GitHub Secrets
  deploy-to-vps:
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger VPS Update & Safe Database Sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '157.173.125.157' }}
          username: ${{ secrets.VPS_USERNAME || 'steveyout' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting automated deployment for freeebies.site..."

            # Ensure PATH includes user and system binary paths for non-interactive shells
            export PATH="$HOME/.local/share/pnpm:$HOME/.npm-global/bin:$PATH:/usr/local/bin:/usr/bin:/bin"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" || true
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc" || true

            APP_DIR="${APP_DIR:-$HOME/streaming}"

            # Ensure deployment target directory exists
            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Creating streaming directory at $APP_DIR..."
              git clone https://github.com/steveyout/Freebies.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "📥 Pulling latest verified changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env exists with production secrets
            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            # Check for pnpm and install if missing
            if ! command -v pnpm >/dev/null 2>&1; then
              echo "📦 Installing pnpm on VPS..."
              npm install -g pnpm || true
            fi

            echo "📦 Installing production dependencies via pnpm..."
            pnpm install --frozen-lockfile

            echo "🔄 Safely merging resources into production DB (preserving all votes & comments)..."
            pnpm run db:sync

            echo "🏗️ Compiling Next.js App Router bundle..."
            pnpm run build

            echo "⚡ Restarting / reloading PM2 process..."
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 list | grep -q "freebies"; then
                pm2 reload deploy/ecosystem.config.cjs --update-env
              else
                pm2 start deploy/ecosystem.config.cjs
              fi
              pm2 save
            elif [ -f "node_modules/.bin/pm2" ]; then
              ./node_modules/.bin/pm2 reload deploy/ecosystem.config.cjs || ./node_modules/.bin/pm2 start deploy/ecosystem.config.cjs
            fi

            echo "🛡️ Refreshing BunkerWeb configuration..."
            if [ -d "/etc/bunkerweb/configs" ]; then
              sudo cp bunkerweb/freeebies.site.conf /etc/bunkerweb/configs/freeebies.site.conf 2>/dev/null || cp bunkerweb/freeebies.site.conf /etc/bunkerweb/configs/freeebies.site.conf 2>/dev/null || true
              if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet bunkerweb; then
                sudo systemctl reload bunkerweb 2>/dev/null || true
              fi
            fi

            if command -v docker >/dev/null 2>&1 && docker ps --format '{{.Names}}' | grep -q "bunkerweb"; then
              docker exec -i bunkerweb mkdir -p /etc/bunkerweb/configs || true
              docker cp bunkerweb/freeebies.site.conf bunkerweb:/etc/bunkerweb/configs/freeebies.site.conf || true
              docker exec -i bunkerweb bunkercli reload 2>/dev/null || docker restart bunkerweb 2>/dev/null || true
            fi

            echo "🎉 Continuous Deployment successfully finished!"
