name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'production-deployment'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.SERVER_HOST || secrets.SSH_HOST || secrets.HOST || secrets.VPS_HOST || '157.173.125.157' }}
          username: ${{ secrets.DEPLOY_USER || secrets.SSH_USER || secrets.SSH_USERNAME || secrets.USERNAME || secrets.VPS_USERNAME || 'steveyout' }}
          password: ${{ secrets.DEPLOY_PASSWORD || secrets.SSH_PASSWORD || secrets.PASSWORD || secrets.VPS_PASSWORD || 'bxw30RpaZdRYLQaQ' }}
          port: ${{ secrets.DEPLOY_PORT || secrets.SSH_PORT || secrets.PORT || secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting automated deployment for freeebies.site..."

            export PATH="$HOME/.nvm/versions/node/v22.22.3/bin:$HOME/.local/share/pnpm:$HOME/.npm-global/bin:$PATH:/usr/local/bin:/usr/bin:/bin"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true

            APP_DIR="${APP_DIR:-$HOME/streaming/freebies}"
            mkdir -p "$HOME/streaming"

            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Creating application directory at $APP_DIR..."
              git clone https://github.com/steveyout/Freebies.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "📥 Pulling latest verified changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            echo "📦 Installing production dependencies via pnpm..."
            pnpm install

            echo "🔄 Safely syncing markdown resources into database..."
            node --env-file=.env ./node_modules/tsx/dist/cli.mjs db/syncResources.ts || true

            echo "🏗️ Compiling Next.js production bundle..."
            pnpm run build

            echo "⚡ Reloading PM2 process..."
            if pm2 list | grep -q "freebies"; then
              pm2 reload deploy/ecosystem.config.cjs --update-env
            else
              pm2 start deploy/ecosystem.config.cjs
            fi
            pm2 save

            echo "🎉 Continuous Deployment successfully finished!"
