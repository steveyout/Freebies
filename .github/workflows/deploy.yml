name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'production-deployment'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Application
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST || secrets.SERVER_HOST || secrets.SSH_HOST || secrets.HOST || secrets.VPS_HOST || vars.DEPLOY_HOST || vars.SERVER_HOST || vars.SSH_HOST || vars.HOST || vars.VPS_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER || secrets.SERVER_USER || secrets.SSH_USER || secrets.USER || secrets.VPS_USERNAME || vars.DEPLOY_USER || vars.SERVER_USER || vars.SSH_USER || vars.USER || vars.VPS_USERNAME }}
          SSH_PASS: ${{ secrets.DEPLOY_PASSWORD || secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD || secrets.PASSWORD || secrets.VPS_PASSWORD || vars.DEPLOY_PASSWORD || vars.SERVER_PASSWORD || vars.SSH_PASSWORD || vars.PASSWORD || vars.VPS_PASSWORD }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || secrets.SERVER_PORT || secrets.SSH_PORT || secrets.PORT || secrets.VPS_PORT || vars.DEPLOY_PORT || vars.SERVER_PORT || vars.SSH_PORT || vars.PORT || vars.VPS_PORT }}
        run: |
          set -e
          TARGET_HOST="${SSH_HOST:-157.173.125.157}"
          TARGET_USER="${SSH_USER:-steveyout}"
          TARGET_PASS="${SSH_PASS:-bxw30RpaZdRYLQaQ}"
          TARGET_PORT="${SSH_PORT:-22}"

          echo "🚀 Starting automated deployment for freeebies.site..."
          sudo apt-get update -y && sudo apt-get install -y sshpass

          export SSHPASS="$TARGET_PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" << 'EOF'
            set -e
            echo "--- Environment Setup ---"
            export PATH="$HOME/.nvm/versions/node/v22.22.3/bin:$HOME/.local/share/pnpm:$HOME/.npm-global/bin:$PATH:/usr/local/bin:/usr/bin:/bin"
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true

            APP_DIR="${APP_DIR:-$HOME/streaming/freebies}"
            mkdir -p "$HOME/streaming"

            if [ ! -d "$APP_DIR" ]; then
              echo "📁 Creating application directory at $APP_DIR..."
              git clone https://github.com/steveyout/Freebies.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "📥 Pulling latest verified changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f ".env" ]; then
              cp .env.example .env
            fi

            echo "📦 Installing production dependencies via pnpm..."
            pnpm install

            echo "🔄 Safely syncing markdown resources into database..."
            node --env-file=.env ./node_modules/tsx/dist/cli.mjs db/syncResources.ts || true

            echo "🏗️ Compiling Next.js production bundle..."
            pnpm run build

            echo "⚡ Reloading PM2 process..."
            if pm2 list | grep -q "freebies"; then
              pm2 reload deploy/ecosystem.config.cjs --update-env
            else
              pm2 start deploy/ecosystem.config.cjs
            fi
            pm2 save

            echo "🎉 Continuous Deployment successfully finished!"
          EOF
