name: Deploy to Production

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: 'production-deployment'
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Deployment Dependencies
        run: pip install paramiko

      - name: Execute Deployment
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST || secrets.SERVER_HOST || secrets.SSH_HOST || secrets.HOST || secrets.VPS_HOST || vars.DEPLOY_HOST || vars.SERVER_HOST || vars.SSH_HOST || vars.HOST || vars.VPS_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER || secrets.SERVER_USER || secrets.SSH_USER || secrets.USER || secrets.VPS_USERNAME || vars.DEPLOY_USER || vars.SERVER_USER || vars.SSH_USER || vars.USER || vars.VPS_USERNAME }}
          SSH_PASS: ${{ secrets.DEPLOY_PASSWORD || secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD || secrets.PASSWORD || secrets.VPS_PASSWORD || vars.DEPLOY_PASSWORD || vars.SERVER_PASSWORD || vars.SSH_PASSWORD || vars.PASSWORD || vars.VPS_PASSWORD }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || secrets.SERVER_PORT || secrets.SSH_PORT || secrets.PORT || secrets.VPS_PORT || vars.DEPLOY_PORT || vars.SERVER_PORT || vars.SSH_PORT || vars.PORT || vars.VPS_PORT }}
        run: python deploy/deploy.py
